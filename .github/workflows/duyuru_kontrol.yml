name: Duyuru Kontrol Botu

# ============================================================
# Bu workflow, GitHub Actions'a "ne zaman ve nasıl çalışacağını" söyler.
# ============================================================

on:
  # ⏰ ZAMANLANMIŞ ÇALIŞMA (Cron)
  # Her 15 dakikada bir otomatik olarak çalışır.
  # Cron formatı: dakika saat gün ay haftanın-günü
  # */15 = her 15 dakikada bir, * = her saat/gün/ay/gün
  schedule:
    - cron: "*/15 * * * *"

  # 🖱️ MANUEL ÇALIŞMA
  # GitHub Actions sayfasından "Run workflow" butonuyla
  # istediğin zaman elle de çalıştırabilirsin.
  workflow_dispatch:

# ============================================================
# İZİNLER
# Workflow'un repo'ya yazma (commit) izni olması gerekiyor.
# Çünkü son_duyuru_id.txt dosyasını güncelleyip geri commit ediyor.
# ============================================================
permissions:
  contents: write

# ============================================================
# YAPILACAK İŞLER (Jobs)
# ============================================================
jobs:
  duyuru-kontrol:
    # Ubuntu Linux üzerinde çalışacak (GitHub'ın ücretsiz sunucusu)
    runs-on: ubuntu-latest

    steps:
      # ────────────────────────────────────────
      # ADIM 1: Repo'nun kodlarını indir (checkout)
      # ────────────────────────────────────────
      - name: 📥 Repo'yu indir
        uses: actions/checkout@v4

      # ────────────────────────────────────────
      # ADIM 2: Python'u kur
      # ────────────────────────────────────────
      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ────────────────────────────────────────
      # ADIM 3: Gerekli kütüphaneleri yükle
      # ────────────────────────────────────────
      - name: 📦 Kütüphaneleri yükle
        run: pip install -r requirements.txt

      # ────────────────────────────────────────
      # ADIM 4: Duyuru kontrol botunu çalıştır
      # GitHub Secrets'taki değerler ortam değişkeni
      # olarak koda aktarılır.
      # ────────────────────────────────────────
      - name: 🔍 Duyuruları kontrol et
        env:
          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_SIFRE: ${{ secrets.GMAIL_SIFRE }}
          ALICI_EMAIL: ${{ secrets.ALICI_EMAIL }}
        run: python duyuru_takip.py

      # ────────────────────────────────────────
      # ADIM 5: Hafıza dosyasını repo'ya geri kaydet
      # Eğer son_duyuru_id.txt değiştiyse (yeni duyuru geldiyse),
      # değişikliği otomatik olarak commit edip push eder.
      # Değişiklik yoksa bu adım sessizce atlanır.
      # ────────────────────────────────────────
      - name: 💾 Hafıza dosyasını güncelle
        run: |
          git config user.name "Duyuru Bot"
          git config user.email "bot@duyuru-takip.local"
          git add son_duyuru_id.txt
          git diff --staged --quiet || git commit -m "🔄 Son duyuru ID güncellendi [bot]"
          git push
